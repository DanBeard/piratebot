; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3

[env:native]
platform = native
test_framework = unity
build_flags = 
	-D MESH_SESSION=\"halloween-2026\"
	-D MESH_NODE_ID=\"test_node\"
	-D UNIT_TEST
lib_deps = bblanchon/ArduinoJson@^6.21.0
lib_extra_dirs = 
	lib_native
test_build_src = yes
build_src_filter = 
	+<src/codec/message.cpp>
	+<src/profiles.cpp>
	+<src/effect_engine.cpp>
	+<src/sensor_engine.cpp>
	+<src/config/config_manager.cpp>
	+<src/config/config_handler.cpp>
	+<src/ota/ota_manager.cpp>
	-<src/transports/*>
	-<src/main.cpp>

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson@^7.1.0
	me-no-dev/AsyncTCP@^1.1.1
	me-no-dev/ESP Async WebServer@^1.2.4
	ottowinter/AsyncMqttClient@^0.9.0
	fastled/FastLED@^3.7.0
build_flags = 
	-D MESH_SESSION=\"halloween-2026\"
	-D CORE_DEBUG_LEVEL=3
	-D MESH_MAX_TOPIC_IDS=64

[env:esp32-c6]
platform = espressif32@6.9.0
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = 
	bblanchon/ArduinoJson@^7.1.0
	me-no-dev/AsyncTCP@^1.1.1
	me-no-dev/ESP Async WebServer@^1.2.4
	ottowinter/AsyncMqttClient@^0.9.0
	fastled/FastLED@^3.7.0
build_flags = 
	-D MESH_SESSION=\"halloween-2026\"
	-D CORE_DEBUG_LEVEL=3
	-D MESH_MAX_TOPIC_IDS=64
