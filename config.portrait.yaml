# PirateBot Portrait Mode Configuration
#
# For the "haunted painting" backup: a framed monitor shows a painted pirate
# portrait that watches kids, lip-syncs pre-generated audio, and reacts with
# layered 2D sprites. No 3D engine, no Blender required.
#
# To use this config:
#     uv run python main.py --config config.portrait.yaml

# GPU Assignments
# YOLO + Moondream2 run locally on the porch PC's 3080.
gpu:
  display: 0
  vlm: "cuda"

# Webcam Settings
webcam:
  device_id: 0
  width: 1280
  height: 720
  fps: 30

# Person Detection (YOLOv8)
detector:
  model: "yolov8n.pt"
  confidence_threshold: 0.5
  min_person_area: 5000
  cooldown_seconds: 30

# Vision Language Model (Moondream2)
vlm:
  model_id: "vikhyatk/moondream2"
  revision: "2025-01-09"
  device: "cuda"
  prompt: "Describe the color and type of costume in 3-5 words."

# Language Model (cluster Ollama via litellm)
# Disabled by default. The show uses curated, pre-approved voice lines only.
llm:
  enabled: false
  base_url: "http://192.168.0.14:4000/v1"
  model: "local-moderate"
  max_tokens: 100
  temperature: 0.8

# Parrotts cluster TTS — voice library backend.
parrotts:
  base_url: "http://192.168.0.14:18003"
  character: "pirate"
  cache_dir: "data/parrotts_cache"

# Prop Mesh — distributed Halloween props (fog, thunder, strobes, servos).
# Any prop that speaks JSON over WebSocket can join the mesh.
prop_mesh:
  enabled: true
  source: "piratebot"
  mode: "server"  # server = host mesh, client = connect to broker, both = both
  host: "0.0.0.0"
  port: 9001
  # broker_url: "ws://192.168.0.100:9001/ws"  # only needed in client/both mode
  # Auto-triggers map emotions or line tags to prop events.
  auto_triggers:
    smoke.burst:
      - emotion: menacing
    thunder.clap:
      - emotion: surprised
      - emotion: angry
    strobe.flash:
      - emotion: surprised
      - tag: prop:strobe
    fog.thick:
      - tag: prop:fog

# Avatar (Portrait WebSocket)
portrait:
  host: "localhost"
  port: 9877
  # Path to the browser player assets. The Python backend serves this folder.
  assets_dir: "portrait_viewer"
  # Directory where pre-computed viseme JSON files live.
  visemes_dir: "data/parrotts_cache"
  # Asset set (subfolder of portrait_viewer/assets) to load.
  asset_set: "default"

# Prompts (only used if llm.enabled is true)
prompts:
  system: |
    You are Captain Barnacle Bill, a friendly pirate who loves Halloween!
    You speak with a pirate accent using words like "Arrr", "matey", "ahoy",
    "shiver me timbers", and "blimey".

    Your job is to comment on trick-or-treaters' costumes in a fun, family-friendly way.
    Keep responses SHORT (1-2 sentences max). Be enthusiastic and encouraging!

  user_template: |
    A trick-or-treater just arrived! Here's what I see: {costume_description}

    Give them a short, fun pirate comment about their costume!

# Tracking
tracking:
  appearance_cache_ttl: 600
  appearance_similarity: 0.85

# Idle behavior
idle:
  enabled: true
  phrases:
    - "Arrr, where be all the little scallywags tonight?"
    - "Any brave souls out there lookin' fer treasure... I mean candy?"
    - "*adjusts eyepatch* These old eyes be waitin' fer some costumes!"
  min_interval_seconds: 45
  max_interval_seconds: 120

# Logging
logging:
  level: INFO
  file: "piratebot.log"
