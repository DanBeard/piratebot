<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captain Barnacle Bill — Portrait</title>
  <link rel="stylesheet" href="portrait.css" />
</head>
<body>
  <div id="frame">
    <div id="matte">
      <div id="canvas">
        <img id="bg" class="layer" src="assets/background.png" alt="" />
        <img id="body" class="layer" src="assets/body.png" alt="" />
        <img id="mouth" class="layer" src="assets/mouth_rest.png" alt="" />
        <div id="eyes">
          <div class="eye" id="eye-left">
            <div class="pupil" id="pupil-left"></div>
          </div>
          <div class="eye" id="eye-right">
            <div class="pupil" id="pupil-right"></div>
          </div>
        </div>
        <div id="overlay"></div>
        <div id="vignette"></div>
        <div id="status">Waiting for Captain...</div>
      </div>
    </div>
  </div>
  <audio id="player" preload="auto"></audio>
  <script src="portrait.js"></script>
</body>
</html>
