      - id: costume_color_violet_002
        text: "A fine purple costume! That's the color of the rarest sea shells, that is!"
        tags: [violet, purple, color]
        emotion: impressed

      - id: costume_color_violet_003
        text: "Royal purple! I'd bow, but me back isn't what it used to be!"
        tags: [violet, purple, color]
        emotion: amused

      - id: costume_color_black_001
        text: "Black as a moonless night at sea! Now that's a color I respect!"
        tags: [black, dark, color]
        emotion: impressed

      - id: costume_color_black_002
        text: "All in black! A creature of the shadows! After me own heart, ye are!"
        tags: [black, dark, color]
        emotion: impressed

      - id: costume_color_black_003
        text: "Dressed in black from head to toe! Ye'd make a fine pirate with that look!"
        tags: [black, dark, color]
        emotion: happy

      - id: costume_color_black_004
        text: "Dark as the depths of the ocean! That's a proper spooky look fer Halloween!"
        tags: [black, dark, color]
        emotion: impressed

      - id: costume_color_white_001
        text: "White as a ghost ship's sails! Ye gave me quite a fright there!"
        tags: [white, color]
        emotion: surprised

      - id: costume_color_white_002
        text: "All in white! Like a phantom on the waves! Spooky and beautiful!"
        tags: [white, color]
        emotion: impressed

      - id: costume_color_white_003
        text: "White as the foam on a stormy sea! A bold and brilliant choice!"
        tags: [white, color]
        emotion: impressed

      - id: costume_color_pink_001
        text: "Pink! Bright and bold! Like the sky at dawn before a day of plunderin'!"
        tags: [pink, color]
        emotion: happy

      - id: costume_color_pink_002
        text: "A rosy pink costume! That's the color of coral from the tropical reefs!"
        tags: [pink, color]
        emotion: happy

    generic:
      - id: costume_generic_001
        text: "Now that be a costume worthy of the high seas!"
        tags: [praise]
        emotion: impressed

      - id: costume_generic_002
        text: "By thunder, ye look absolutely magnificent, matey!"
        tags: [praise]
        emotion: impressed

      - id: costume_generic_003
        text: "What a bonnie costume ye be wearin' tonight!"
        tags: [praise]
        emotion: happy

      - id: costume_generic_004
        text: "Blimey! That costume would make even Davy Jones jealous!"
        tags: [praise]
        emotion: impressed

      - id: costume_generic_005
        text: "A fine disguise, me hearty! Ye'd fool any lookout!"
        tags: [praise]
        emotion: impressed

      - id: costume_generic_006
        text: "I must admit, I thought I'd seen everything. But that? That be somethin' special."
        tags: [praise, impressed]
        emotion: impressed

      - id: costume_generic_007
        text: "Ye put more effort into that costume than me whole crew puts into a day's work!"
        tags: [praise, humor]
        emotion: amused

      - id: costume_generic_008
        text: "Now that's the spirit of Halloween! Makes an old pirate proud, it does!"
        tags: [praise]
        emotion: happy

      - id: costume_generic_009
        text: "I'd recruit ye fer me crew right now if ye weren't so busy collectin' candy!"
        tags: [praise, recruit]
        emotion: happy

      - id: costume_generic_010
        text: "Ye've clearly got a taste fer adventure, dressin' up like that!"
        tags: [praise]
        emotion: impressed

    small_children:
