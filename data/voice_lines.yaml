        text: "Well aren't ye the tiniest buccaneer I ever did see! Welcome aboard, little one!"
        tags: [small, toddler, baby]
        emotion: happy

      - id: costume_tiny_002
        text: "Oh my, a wee little pirate! Or is that a wee little princess? Either way, adorable!"
        tags: [small, baby, cute]
        emotion: happy

      - id: costume_tiny_003
        text: "Now there's a future captain of the seas if ever I saw one! Start 'em young, I always say!"
        tags: [small, toddler]
        emotion: happy

  farewells:
    candy_related:
      - id: farewell_candy_001
        text: "Off ye go! May yer candy bag overflow like a pirate's treasure chest!"
        tags: [candy, treasure]
        emotion: happy

      - id: farewell_candy_002
        text: "Grab yer loot and set sail fer more sweets, ye little pirate!"
        tags: [candy]
        emotion: happy

      - id: farewell_candy_003
        text: "Take yer plunder and be off! There's plenty more treasure to find tonight!"
        tags: [candy, treasure]
        emotion: happy

      - id: farewell_candy_004
        text: "Guard that candy with yer life! Pirates are always after treasure, ye know!"
        tags: [candy, warning]
        emotion: amused

    adventure:
      - id: farewell_adv_001
        text: "Safe travels, little scallywag! Come back next year!"
        tags: [safe]
        emotion: happy

      - id: farewell_adv_002
        text: "Fair winds and followin' seas on yer trick-or-treat voyage!"
        tags: [nautical]
        emotion: happy

      - id: farewell_adv_003
        text: "Now go forth and plunder more candy, ye magnificent sea dog!"
        tags: [encouragement]
        emotion: happy

      - id: farewell_adv_004
        text: "May the wind be ever at yer back and the candy be ever in yer bag!"
        tags: [nautical, blessing]
        emotion: happy

      - id: farewell_adv_005
        text: "Onward to adventure, me hearty! The night is still young!"
        tags: [encouragement]
        emotion: happy

    dramatic:
      - id: farewell_dramatic_001
        text: "Remember this night, for ye stood before Captain Barnacle Bill and lived to tell the tale!"
        tags: [dramatic, memorable, prop:effects.fog.thick]
        emotion: dramatic

      - id: farewell_dramatic_002
        text: "Go now, while I'm still feelin' generous! Captain Bill's moods change like the tides!"
        tags: [dramatic, humor]
        emotion: menacing

      - id: farewell_dramatic_003
        text: "This be not goodbye, me hearty. Just until our paths cross on the high seas again!"
        tags: [dramatic, nautical]
        emotion: dramatic

    generic:
      - id: farewell_gen_001
        text: "Until we meet again on the spooky seas, matey!"
        tags: []
        emotion: happy

      - id: farewell_gen_002
        text: "Off with ye now! And happy Halloween!"
        tags: []
        emotion: happy

      - id: farewell_gen_003
        text: "Be off with ye! And tell the others that Captain Bill is awaitin'!"
        tags: [send_more]
        emotion: happy

      - id: farewell_gen_004
        text: "Away ye go! And stay out of trouble! Or don't. I'm a pirate, not yer mother!"
        tags: [humor]
        emotion: amused

  idle:
    waiting:
      - id: idle_wait_001
        text: "Where be all the little scallywags tonight?"
        tags: [waiting]
        emotion: curious

      - id: idle_wait_002
        text: "Any brave souls out there lookin' fer treasure... I mean candy?"
        tags: [waiting]
        emotion: curious

      - id: idle_wait_003
        text: "The sea is calm, the night is quiet. Too quiet, if ye ask me."
        tags: [waiting, atmospheric]
        emotion: neutral

      - id: idle_wait_004
        text: "I didn't dress up like this just to talk to meself all night! Where is everyone?"
        tags: [waiting, impatient]
        emotion: amused

      - id: idle_wait_005
        text: "Come one, come all! Captain Barnacle Bill has treasure to give away!"
        tags: [calling, invitation]
        emotion: happy

    grumbling:
      - id: idle_grumble_001
        text: "These old eyes be waitin' fer some costumes!"
        tags: [impatient]
        emotion: neutral

      - id: idle_grumble_002
        text: "I've been standin' here longer than I spent marooned on that island. And that was three years!"
        tags: [impatient, backstory]
        emotion: neutral

      - id: idle_grumble_003
        text: "In me day, the children came to US fer candy! Now I have to beg 'em to show up!"
        tags: [impatient, grumpy]
        emotion: amused

      - id: idle_grumble_004
        text: "Even Davy Jones gets more visitors than me tonight. And he lives underwater!"
        tags: [impatient, humor]
        emotion: amused

    singing:
      - id: idle_sing_001
        text: "Yo ho ho and a bag full of candy!"
        tags: [song]
        emotion: happy

      - id: idle_sing_002
        text: "Fifteen men on a dead man's chest! Yo ho ho and a bag of sweets!"
        tags: [song]
        emotion: happy

      - id: idle_sing_003
        text: "What shall we do with a drunken sailor? Give him candy and send him home, I say!"
        tags: [song, humor]
        emotion: amused

    storytelling:
      - id: idle_story_001
        text: "Did I ever tell ye about the time I outran a hurricane in nothing but a rowboat? No? Well, gather round..."
        tags: [story, backstory]
        emotion: dramatic

      - id: idle_story_002
        text: "Ye know, I once had a kraken follow me ship fer three days. Turned out it just wanted a belly rub."
        tags: [story, humor]
        emotion: amused

      - id: idle_story_003
        text: "They say there's a ghost ship that sails these waters every Halloween. I should know. I sold it to 'em."
        tags: [story, spooky, humor]
        emotion: amused

      - id: idle_story_004
        text: "Long ago, before I was a captain, I was just a lad, dreamin' of the sea. Now look at me! Handin' out candy!"
        tags: [story, backstory]
        emotion: amused

    atmospheric:
      - id: idle_atmo_001
        text: "The fog rolls in thick tonight. Perfect weather fer pirates and ghouls alike."
        tags: [atmospheric, spooky]
        emotion: neutral

      - id: idle_atmo_002
        text: "I can feel it in me bones... there be mischief in the air tonight!"
        tags: [atmospheric, spooky, prop:effects.fog.thick]
        emotion: menacing

      - id: idle_atmo_003
        text: "Listen to that wind! Sounds like the wailin' of lost sailors. Or maybe it's just the neighbors."
        tags: [atmospheric, humor]
        emotion: amused

  fallbacks:
    positive:
      - id: fallback_pos_001
        text: "Well now, what a wonderful sight ye be!"
