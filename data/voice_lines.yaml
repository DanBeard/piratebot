      - id: costume_color_yellow_001
        text: "Yellow like gold doubloons! Me favorite color, that is!"
        tags: [yellow, gold, color]
        emotion: happy

      - id: costume_color_yellow_002
        text: "Bright as the sun on the open seas! That yellow costume shines, it does!"
        tags: [yellow, color]
        emotion: impressed

      - id: costume_color_yellow_003
        text: "All that gold! I mean yellow! Though fer a pirate, it's the same thing!"
        tags: [yellow, gold, color]
