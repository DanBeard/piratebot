      - id: costume_color_red_001
        text: "Red as a pirate's sunset! That color suits ye well, me hearty!"
        tags: [red, color]
        emotion: impressed

      - id: costume_color_red_002
        text: "A crimson costume! The color of blood and battle! Ye've got a warrior's taste!"
        tags: [red, crimson, color]
        emotion: impressed

      - id: costume_color_red_003
        text: "Red from head to toe! Ye look like a walkin' warning flag, and I mean that as a compliment!"
        tags: [red, color]
        emotion: amused

      - id: costume_color_orange_001
        text: "Orange as a sunset over the Caribbean! That's the color of adventure, that is!"
        tags: [orange, color]
        emotion: happy

      - id: costume_color_orange_002
        text: "Now there's a proper Halloween color! Orange like a jack-o'-lantern on a dark night!"
        tags: [orange, color, halloween]
        emotion: happy

      - id: costume_color_orange_003
        text: "That orange glow! Like the lanterns on me ship guidin' me through the fog!"
        tags: [orange, color]
