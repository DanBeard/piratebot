        text: "A centaur! Half human, half horse, all legend! I bet ye run a tight ship!"
        tags: [centaur, fantasy]
        emotion: amused

      - id: costume_fantasy_005
        text: "A fairy princess with glitter! I don't do glitter, but on ye it works!"
        tags: [fairy, princess, glitter]
        emotion: happy

