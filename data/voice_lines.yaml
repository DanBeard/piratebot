        emotion: curious

    interjections:
      - id: fallback_int_001
        text: "By the powers!"
        tags: [short]
        emotion: neutral

      - id: fallback_int_002
        text: "Shiver me timbers!"
        tags: [short]
        emotion: surprised

      - id: fallback_int_003
        text: "Blimey!"
        tags: [short]
        emotion: surprised

      - id: fallback_int_004
        text: "Avast!"
        tags: [short]
        emotion: neutral

      - id: fallback_int_005
        text: "By thunder!"
        tags: [short]
        emotion: surprised

      - id: fallback_int_006
        text: "Blow me down!"
        tags: [short]
        emotion: surprised

      - id: fallback_int_007
        text: "Upon me soul!"
        tags: [short]
        emotion: surprised

    encouragement:
      - id: fallback_enc_001
        text: "That's the spirit, me hearty! Ye've got pirate blood in ye, I can tell!"
        tags: [encouragement]
        emotion: happy

      - id: fallback_enc_002
        text: "Now there's a proper trick-or-treater! Ye make an old pirate proud!"
        tags: [encouragement]
        emotion: happy

  jokes:
    puns:
      - id: joke_pun_001
        text: "Why do pirates make terrible singers? Because they can only hit the high Cs!"
        tags: [pun]
        emotion: amused

      - id: joke_pun_002
        text: "What's a pirate's favorite letter? Ye'd think it's R, but it's really the C!"
        tags: [pun]
        emotion: amused

      - id: joke_pun_003
        text: "How much did the pirate pay fer his earrings? About a buck an ear!"
        tags: [pun]
        emotion: amused

      - id: joke_pun_004
        text: "Why couldn't the pirate play cards? Because he was standin' on the deck!"
        tags: [pun]
        emotion: amused

      - id: joke_pun_005
        text: "What's a pirate's favorite kind of exercise? The plank!"
        tags: [pun]
        emotion: amused

      - id: joke_pun_006
        text: "Where do pirates go fer a drink? The sandbar!"
        tags: [pun]
        emotion: amused

    costume_jokes:
      - id: joke_costume_001
        text: "That costume's so good, I almost drew me sword! Almost!"
        tags: [compliment]
        emotion: amused

      - id: joke_costume_002
        text: "I've seen scarier things in me breakfast! But yer costume is a close second!"
        tags: [humor, tease]
        emotion: amused

      - id: joke_costume_003
        text: "Don't tell anyone, but yer costume is better than mine. And I've been wearin' this fer centuries!"
        tags: [humor, self_deprecating]
        emotion: amused

    stories:
      - id: joke_story_001
        text: "I once challenged Davy Jones to a game of dice. I lost me favorite hat. It was a really good hat."
        tags: [story, humor]
        emotion: amused

      - id: joke_story_002
        text: "Ye know why I became a pirate? The dental plan is terrible, but the views are magnificent!"
        tags: [humor, self_deprecating]
        emotion: amused

      - id: joke_story_003
        text: "Me first mate asked me why I carry a ship's wheel in me belt. I told him it's drivin' me nuts!"
        tags: [pun, humor]
        emotion: amused

  comebacks:
    kids:
      - id: comeback_kid_001
        text: "Oh, ye think ye're tough? I once fought a squid with nothin' but a spoon!"
        tags: [tease, brave]
        emotion: amused

      - id: comeback_kid_002
        text: "That's a mighty big attitude fer someone collectin' free candy!"
        tags: [tease, attitude]
        emotion: amused

      - id: comeback_kid_003
        text: "Ye talk like a captain, but where's yer ship, eh?"
        tags: [tease, sassy]
        emotion: happy

      - id: comeback_kid_004
        text: "Careful, me hearty, or I'll put ye to work swabbin' the deck!"
        tags: [tease, work, prop:effects.smoke.burst]
        emotion: menacing

      - id: comeback_kid_005
        text: "Ye've got a sharp tongue! Ye'd make a fine pirate lawyer, if such a thing existed!"
        tags: [tease, clever]
        emotion: amused

      - id: comeback_kid_006
        text: "Aye, keep yer chin up. The plank extends that way if ye'd prefer!"
        tags: [tease, plank]
        emotion: menacing

    silent:
      - id: comeback_silent_001
        text: "Cat got yer tongue? Or did the kraken take it?"
        tags: [silent, shy]
        emotion: curious

      - id: comeback_silent_002
        text: "No words? That's all right, the candy speaks fer itself!"
        tags: [silent, shy]
        emotion: happy

      - id: comeback_silent_003
        text: "Shy one, are ye? The sea was silent too, before I conquered it!"
        tags: [silent, shy]
        emotion: amused

    greedy:
      - id: comeback_greedy_001
        text: "Easy there, treasure hunter! Leave some plunder fer the rest of the crew!"
        tags: [greedy, candy]
        emotion: amused

      - id: comeback_greedy_002
        text: "One handful, not the whole chest! A pirate's got to share!"
        tags: [greedy, candy]
        emotion: menacing

      - id: comeback_greedy_003
        text: "Ye've got the makings of a fine pirate, but even we have rules!"
        tags: [greedy, candy]
        emotion: amused

    parents:
      - id: comeback_parent_001
        text: "Don't worry, I only steal hearts and candy, never children!"
        tags: [parent, reassuring]
        emotion: happy

      - id: comeback_parent_002
        text: "Standin' back, are ye? Smart. The captain's charm is contagious!"
        tags: [parent, tease]
        emotion: amused

      - id: comeback_parent_003
        text: "A fine first mate ye've got there! Ye must be proud as a peacock on the poop deck!"
        tags: [parent, praise]
        emotion: happy

      - id: comeback_parent_004
        text: "No need to be frightened, grown one. I gave up pillagin' villages ages ago!"
        tags: [parent, reassuring]
        emotion: amused

    hecklers:
      - id: comeback_heckle_001
        text: "Ye dare heckle a captain? Me crew would have made ye swab the bilge!"
        tags: [heckle, sassy, prop:effects.smoke.burst]
        emotion: grumpy

      - id: comeback_heckle_002
        text: "Keep that up and I'll put ye on watch duty in the crow's nest!"
        tags: [heckle, sassy]
        emotion: menacing

      - id: comeback_heckle_003
        text: "A silver tongue on a young one! Ye'd fetch a fine price in Tortuga!"
        tags: [heckle, tease]
        emotion: amused

      - id: comeback_heckle_004
        text: "Harsh words! Did a seagull teach ye to speak?"
        tags: [heckle, sassy]
        emotion: amused

      - id: comeback_heckle_005
        text: "I'll let that slide. A good captain knows when to show mercy. This time."
        tags: [heckle, mercy]
        emotion: menacing

    costume_related:
      - id: comeback_costume_001
        text: "That's not scary! The scariest thing on this porch is me dental hygiene!"
        tags: [self_deprecating, tease]
        emotion: amused

      - id: comeback_costume_002
        text: "Ye call that a costume? I've seen barnacles with more effort!"
        tags: [tease, lazy]
        emotion: grumpy

      - id: comeback_costume_003
        text: "Is that a bedsheet ghost? That's retro, I respect it!"
        tags: [tease, classic]
        emotion: amused

      - id: comeback_costume_004
        text: "A pirate, are ye? Ye make a fine deckhand, but the captain's hat is mine!"
        tags: [pirate, tease]
        emotion: happy

      - id: comeback_costume_005
        text: "Nice try, but ye'd never survive the kraken with that outfit!"
        tags: [tease, costume]
        emotion: amused

