        text: "That shade of blue! Reminds me of the deep waters where the real treasures lie!"
        tags: [blue, color]
        emotion: impressed

      - id: costume_color_blue_003
        text: "Blue as the flag of a friendly ship! I know ye come in peace. Probably."
        tags: [blue, color]
