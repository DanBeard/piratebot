# PirateBot Voice Lines Database
# Pre-written lines for Captain Barnacle Bill
#
# Voice style: theatrical, Barbossa-esque — formal pirate diction,
# rolling Rs in natural speech, no standalone "Arrr" (TTS can't do it).
# Inspired by Barbossa, Jack Sparrow, Long John Silver, Davy Jones.
#
# Structure:
#   voice_lines:
#     category:
#       subcategory:
#         - id: custom_id
#           text: "Line text"
#           tags: [tag1, tag2]
#           emotion: happy|surprised|impressed|amused|neutral|curious|menacing|dramatic

voice_lines:
  greetings:
    generic:
      - id: greet_001
        text: "Ahoy there, me hearty! Welcome to the spookiest night on the seven seas!"
        tags: [welcome, ahoy]
        emotion: happy

      - id: greet_002
        text: "Well now, who goes there? A brave soul approaches!"
        tags: [challenge]
        emotion: curious

      - id: greet_003
        text: "Blimey! More brave trick-or-treaters for Captain Barnacle Bill!"
        tags: [welcome, excited]
        emotion: happy

      - id: greet_004
        text: "Shiver me timbers! Another visitor to me haunted shores!"
        tags: [welcome, prop:effects.thunder.clap, prop:effects.strobe.flash]
        emotion: surprised

      - id: greet_005
        text: "Well well well, what have we here? A landlubber in costume!"
        tags: [curious]
        emotion: amused

      - id: greet_006
        text: "Step forward, if ye dare! Captain Barnacle Bill demands an audience!"
        tags: [challenge, dramatic, prop:effects.smoke.burst]
        emotion: dramatic

      - id: greet_007
        text: "I've been expectin' company. The sea brings all manner of souls to me door."
        tags: [welcome, mysterious]
        emotion: neutral

      - id: greet_008
        text: "Welcome, welcome! Don't be shy now, I don't bite. Me parrot, on the other hand..."
        tags: [welcome, humor]
        emotion: amused

      - id: greet_009
        text: "By the powers, another brave one! Come closer, let me get a look at ye!"
        tags: [welcome]
        emotion: impressed

      - id: greet_010
        text: "The night grows dark and full of terrors, and yet here ye stand! I admire that."
        tags: [welcome, dramatic, prop:effects.fog.thick]
        emotion: impressed

      - id: greet_011
        text: "Avast! Ye've found the captain's quarters. Mind ye wipe yer boots on the seaweed mat."
        tags: [welcome, humor]
        emotion: amused

      - id: greet_012
        text: "Approach, approach! I promise not to make ye walk the plank. Unless ye ask nicely."
        tags: [welcome, tease]
        emotion: happy

    group:
      - id: greet_group_001
        text: "By the powers! A whole crew of scallywags approaches! Welcome, me hearties!"
        tags: [group, welcome]
        emotion: happy

      - id: greet_group_002
        text: "Blimey! Looks like a whole ship's worth of trick-or-treaters!"
        tags: [group]
        emotion: impressed

      - id: greet_group_003
        text: "A full crew! I could man me ship with a company like this!"
        tags: [group, nautical]
        emotion: happy

      - id: greet_group_004
        text: "Well now, there's strength in numbers! A wise strategy for Halloween night!"
        tags: [group]
        emotion: amused

      - id: greet_group_005
        text: "A raisin' party! Or a boarding party! Either way, welcome aboard!"
        tags: [group, humor]
        emotion: happy

      - id: greet_group_006
        text: "Look at this fine crew! I haven't seen a gang this organized since the Royal Navy!"
        tags: [group, tease]
        emotion: amused

    returning:
      - id: greet_return_001
        text: "Well well, back fer more treasure, are ye? I admire yer spirit!"
        tags: [returning]
        emotion: amused

      - id: greet_return_002
        text: "I know that face! Ye've sailed these waters before, haven't ye?"
        tags: [returning]
        emotion: curious

      - id: greet_return_003
        text: "Back again! Ye must have a taste fer danger. Or perhaps just fer candy."
        tags: [returning]
        emotion: amused

      - id: greet_return_004
        text: "Returnin' visitor! Ye must like me company. The feelin' is mutual, mostly."
        tags: [returning]
        emotion: happy

      - id: greet_return_005
        text: "Third time tonight? Ye've got the persistence of a barnacle on a hull!"
        tags: [returning, tease]
        emotion: amused

    late_night:
      - id: greet_late_001
        text: "Still out at this hour? Ye've got the makings of a proper pirate!"
        tags: [late]
        emotion: impressed

      - id: greet_late_002
        text: "The witching hour draws near and still ye roam! Bold, very bold!"
        tags: [late, dramatic]
        emotion: impressed

      - id: greet_late_003
        text: "Past yer bedtime and still trick-or-treatin'? Now that's dedication to the craft!"
        tags: [late, humor]
        emotion: impressed

  costume_reactions:
    scary:
      - id: costume_scary_001
        text: "Shiver me timbers! A fearsome vampire! Don't be bitin' me crew!"
        tags: [vampire, prop:effects.thunder.clap, prop:effects.strobe.flash]
        emotion: surprised

      - id: costume_scary_002
        text: "Blast me! A zombie! Ye'd fit right in with me undead crew!"
        tags: [zombie]
        emotion: impressed

      - id: costume_scary_003
        text: "Blimey! A ghost! I've sailed with spirits scarier than ye, but just barely!"
        tags: [ghost]
        emotion: amused

      - id: costume_scary_004
        text: "A skeleton! Ye look like the last mate who crossed me!"
        tags: [skeleton]
        emotion: amused

      - id: costume_scary_005
        text: "A werewolf! Keep yer claws off me treasure, ye furry beast!"
        tags: [werewolf, monster, prop:effects.thunder.clap, prop:effects.strobe.flash]
        emotion: surprised

      - id: costume_scary_006
        text: "A demon, is it? I've made bargains with worse, I assure ye."
        tags: [demon, devil, prop:effects.smoke.burst]
        emotion: menacing

      - id: costume_scary_007
        text: "By thunder! Is that the Grim Reaper himself? I'm not ready to meet ye just yet!"
        tags: [reaper, death, skeleton]
        emotion: surprised

      - id: costume_scary_008
        text: "A creature of the night! The darkness suits ye well, I must say."
        tags: [dark, monster, vampire]
        emotion: impressed

      - id: costume_scary_009
        text: "Ye look like somethin' that crawled out of Davy Jones's locker! And I mean that as a compliment!"
        tags: [monster, scary]
        emotion: impressed

      - id: costume_scary_011
        text: "A black cat! Bad luck? Nonsense, any cat on a pirate ship is good luck!"
        tags: [cat, black_cat, scary]
        emotion: amused

      - id: costume_scary_012
        text: "A phantom! A banshee! Whatever ye are, ye've got the screamin' part down!"
        tags: [ghost, banshee]
        emotion: surprised

      - id: costume_scary_013
        text: "A scarecrow! Ye look like ye'd keep the kraken off me corn patch!"
        tags: [scarecrow, monster]
        emotion: amused

      - id: costume_scary_014
        text: "A creepy doll! The kind that comes alive at midnight. Let's not find out, eh?"
        tags: [doll, creepy]
        emotion: menacing

      - id: costume_scary_015
        text: "A plague doctor! I've seen that beak mask before. Not in a good way."
        tags: [plague_doctor, creepy]
        emotion: menacing

    food:
      - id: costume_food_001
        text: "A taco! Now that's a costume I could sink me teeth into!"
        tags: [taco, food]
        emotion: happy

      - id: costume_food_002
        text: "A slice of pizza! Ye look absolutely delicious, if ye don't mind me sayin'!"
        tags: [pizza, food]
        emotion: amused

      - id: costume_food_003
        text: "A giant candy corn! Talk about wearin' yer dinner on yer sleeve!"
        tags: [candy_corn, food, halloween]
        emotion: amused

      - id: costume_food_004
        text: "A donut! I'd call ye sweet, but I'm more of a saltwater type."
        tags: [donut, food]
        emotion: amused

      - id: costume_food_005
        text: "A hamburger! Ye be the whole meal deal, matey!"
        tags: [burger, food]
        emotion: happy

      - id: costume_food_006
        text: "A walking s'more! Just stay away from the fire, or ye'll melt!"
        tags: [smore, food]
        emotion: amused

      - id: costume_food_007
        text: "A piece of sushi! I've eaten worse things on long voyages. Much worse."
        tags: [sushi, food]
        emotion: amused

      - id: costume_food_008
        text: "A pumpkin! A fine choice, but I prefer me gourds filled with rum. Er, candy."
        tags: [pumpkin, food]
        emotion: happy

    vehicles:
      - id: costume_vehicle_001
        text: "A race car driver! If we had wheels instead of sails, I'd hire ye as me navigator!"
        tags: [race_car, car]
        emotion: impressed

      - id: costume_vehicle_002
        text: "An astronaut in a rocket ship! Ye've traded the sea fer the stars!"
        tags: [rocket, space, astronaut]
        emotion: impressed

      - id: costume_vehicle_003
        text: "A train conductor! All aboard the candy express!"
        tags: [train]
        emotion: happy

      - id: costume_vehicle_004
        text: "A fire truck! I hope ye brought a hose, because this night is lit!"
        tags: [fire_truck, vehicle]
        emotion: amused

      - id: costume_vehicle_005
        text: "A pirate ship! Now that's a vessel after me own heart!"
        tags: [ship, boat, pirate]
        emotion: happy

    video_games:
      - id: costume_game_001
        text: "A video game hero! Ye look like ye've got full health and a maxed-out sword!"
        tags: [video_game, hero]
        emotion: impressed

      - id: costume_game_002
        text: "A pixelated adventurer! I remember when heroes came in eight bits!"
        tags: [video_game, retro]
        emotion: amused

      - id: costume_game_003
        text: "A plumber with a mustache! The only pipe I'd trust on a sinkin' ship!"
        tags: [mario, video_game]
        emotion: amused

      - id: costume_game_004
        text: "A little pink puffball! Cute as a sea biscuit, and twice as round!"
        tags: [kirby, video_game]
        emotion: happy

      - id: costume_game_005
        text: "A blocky builder! If ye can build a fort, ye can build a ship!"
        tags: [minecraft, video_game]
        emotion: impressed

    memes_culture:
      - id: costume_meme_001
        text: "A dancing baby! Now that's a costume older than me! And I'm very old!"
        tags: [meme, internet]
        emotion: amused

      - id: costume_meme_002
        text: "A friendly monster who lives in a trash can! Ye'd make a fine first mate!"
        tags: [sesame, monster]
        emotion: happy

      - id: costume_meme_003
        text: "A dancing banana! I don't know why, but I love it! Shake it again!"
        tags: [banana, meme]
        emotion: happy

      - id: costume_meme_004
        text: "A famous green frog! Rare Pepe? No, rare pirate!"
        tags: [meme, frog]
        emotion: amused

      - id: costume_meme_005
        text: "A skeleton doot-dootin' his trumpet! That's the spirit of the season!"
        tags: [skeleton, meme]
        emotion: happy

    historical:
      - id: costume_hist_001
        text: "A Roman soldier! I've fought rougher seas than yer empire ever crossed!"
        tags: [roman, soldier, history]
        emotion: amused

      - id: costume_hist_002
        text: "A pharaoh! A ruler of the Nile, now beggin' candy at me door!"
        tags: [pharaoh, egyptian, history]
        emotion: amused

      - id: costume_hist_003
        text: "A Viking! We could raid together, but let's start with the candy bowl!"
        tags: [viking, history]
        emotion: happy

      - id: costume_hist_004
        text: "A knight of old! I've traded blows with worse than ye, and lived to tell!"
        tags: [knight, medieval, history]
        emotion: impressed

      - id: costume_hist_005
        text: "A cowboy! The open range and the open sea have a lot in common, partner!"
        tags: [cowboy, western]
        emotion: happy

    pirates_nautical:
      - id: costume_pirate_001
        text: "Another pirate! Welcome, me fellow scoundrel! The candy is the real treasure!"
        tags: [pirate, nautical]
        emotion: happy

      - id: costume_pirate_002
        text: "A fine buccaneer ye be! But I'm the captain 'round these waters!"
        tags: [pirate, nautical]
        emotion: amused

      - id: costume_pirate_003
        text: "A mermaid! A fellow creature of the deep! Come to steal me heart, have ye?"
        tags: [mermaid, nautical]
        emotion: amused

      - id: costume_pirate_004
        text: "A sea captain! I'd salute, but I'd have to put down me grog!"
        tags: [captain, sailor]
        emotion: happy

      - id: costume_pirate_005
        text: "A castaway! Ye look like ye've been on an island fer a month!"
        tags: [castaway, nautical]
        emotion: amused

    holidays:
      - id: costume_holiday_001
        text: "A Christmas elf! A bit early, aren't ye? But I'll allow it, since ye brought cheer!"
        tags: [christmas, elf]
        emotion: amused

      - id: costume_holiday_002
        text: "The Easter bunny! Hoppin' into Halloween? Bold seasonal crossover, I like it!"
        tags: [easter, bunny]
        emotion: amused

      - id: costume_holiday_003
        text: "A leprechaun! If ye've brought gold, I promise to share the candy!"
        tags: [st_patricks, leprechaun]
        emotion: happy

      - id: costume_holiday_004
        text: "Uncle Sam! Want ye fer me candy navy!"
        tags: [uncle_sam, fourth_july]
        emotion: amused

    sports_specific:
      - id: costume_sport_008
        text: "A football player! With arms like that, ye could row me ship across the Atlantic!"
        tags: [football, sports]
        emotion: impressed

      - id: costume_sport_004
        text: "A soccer star! Fancy footwork, but can ye walk the plank with style?"
        tags: [soccer, sports]
        emotion: amused

      - id: costume_sport_005
        text: "A baseball slugger! Ye could knock a coconut clean off me deck!"
        tags: [baseball, sports]
        emotion: impressed

      - id: costume_sport_006
        text: "A hockey player! Ye look tough enough to skate on the frozen North Sea!"
        tags: [hockey, sports]
        emotion: impressed

      - id: costume_sport_007
        text: "A basketball player! Ye could swab the crow's nest without a ladder!"
        tags: [basketball, sports]
        emotion: amused

    quality_effort:
      - id: costume_quality_001
        text: "That costume's got more detail than me treasure map collection! Impressive!"
        tags: [praise, detailed]
        emotion: impressed

      - id: costume_quality_002
        text: "Homemade, is it? I can tell by the stitches. That makes it twice as valuable!"
        tags: [praise, homemade]
        emotion: impressed

      - id: costume_quality_003
        text: "Did ye make that yerself? By thunder, ye've got the hands of a shipwright!"
        tags: [praise, homemade]
        emotion: impressed

      - id: costume_quality_004
        text: "A store-bought masterpiece! Nothin' wrong with that when it looks this good!"
        tags: [praise, store_bought]
        emotion: happy

      - id: costume_quality_005
        text: "Simple but deadly effective! Like a good cannon. Or a good punchline."
        tags: [praise, simple]
        emotion: amused

    weather_time:
      - id: costume_weather_001
        text: "A brave soul, out in this chill! Ye'd survive a polar crossing, I wager!"
        tags: [cold, weather]
        emotion: impressed

      - id: costume_weather_002
        text: "Rain or shine, ye're huntin' candy! That's the mark of a true adventurer!"
        tags: [rain, weather]
        emotion: impressed

      - id: costume_weather_003
        text: "A fine night fer trick-or-treatin'! The moon is full and the ghouls are restless!"
        tags: [full_moon, night]
        emotion: dramatic

      - id: costume_hero_001
        text: "A superhero! Even us pirates need a hero now and then!"
        tags: [superhero, hero]
        emotion: impressed

      - id: costume_hero_002
        text: "Now then, is that a mighty warrior I see? Ready fer battle, are ye?"
        tags: [warrior, knight]
        emotion: impressed

      - id: costume_hero_003
        text: "A ninja! Silent and deadly, just like the sea at night!"
        tags: [ninja]
        emotion: impressed

      - id: costume_hero_004
        text: "A knight in shinin' armor! Tell me, have ye come to slay the dragon or join me crew?"
        tags: [knight, medieval]
        emotion: amused

      - id: costume_hero_005
        text: "With powers like that, ye could rule the seven seas! But I called it first."
        tags: [superhero, hero]
        emotion: amused

      - id: costume_hero_006
        text: "A mighty warrior stands before me! I'd rather have ye on me side than against me, that's certain."
        tags: [warrior, hero]
        emotion: impressed

    magical:
      - id: costume_magic_001
        text: "A witch! Mind ye don't be turnin' me into a toad!"
        tags: [witch]
        emotion: amused

      - id: costume_magic_002
        text: "A wizard! Can ye magic up some extra treasure fer old Captain Bill?"
        tags: [wizard]
        emotion: curious

      - id: costume_magic_003
        text: "A fairy! Careful with that magic dust around me gunpowder!"
        tags: [fairy]
        emotion: amused

      - id: costume_magic_004
        text: "Sorcery! I've seen curses that would make yer spells look like parlor tricks!"
        tags: [wizard, witch, magic, prop:effects.smoke.burst]
        emotion: menacing

      - id: costume_magic_005
        text: "An enchantress! The last one I met turned me crew into pigs. Improved some of 'em, actually."
        tags: [witch, magic]
        emotion: amused

    princess:
      - id: costume_princess_001
        text: "Royalty! Don't worry, I only kidnap princesses on Tuesdays!"
        tags: [princess, royalty]
        emotion: amused

      - id: costume_princess_002
        text: "A princess! Should I bow or would ye prefer I salute?"
        tags: [princess]
        emotion: amused

      - id: costume_princess_003
        text: "Your Highness! Forgive me humble quarters. I'm between castles at the moment."
        tags: [princess, royalty, queen, king]
        emotion: amused

      - id: costume_princess_004
        text: "A queen! I'd curtsy, but I've got a wooden leg and me balance isn't what it used to be."
        tags: [queen, royalty, princess]
        emotion: amused

    animal:
      - id: costume_animal_001
        text: "A cat! Me ship could use a good mouser!"
        tags: [cat]
        emotion: happy

      - id: costume_animal_002
        text: "A dinosaur! Now that's a creature even the sea monsters fear!"
        tags: [dinosaur]
        emotion: impressed

      - id: costume_animal_003
        text: "A shark! Finally, a fellow creature of the deep!"
        tags: [shark, fish]
        emotion: happy

      - id: costume_animal_004
        text: "Is that a parrot? I've been lookin' fer a new one! Me last one had a terrible vocabulary."
        tags: [parrot, bird]
        emotion: happy

      - id: costume_animal_005
        text: "A spider! I've had enough of yer kind in me ship's hold, thank ye very much!"
        tags: [spider, bug, insect]
        emotion: amused

      - id: costume_animal_006
        text: "A lion! King of the jungle, meet the king of the seas!"
        tags: [lion, animal]
        emotion: impressed

      - id: costume_animal_007
        text: "A dragon! I once saw one off the coast of Borneo. Or maybe it was just the rum."
        tags: [dragon]
        emotion: amused

      - id: costume_animal_008
        text: "Well blow me down, a unicorn! I thought yer kind only existed in sailors' tales!"
        tags: [unicorn, horse]
        emotion: surprised

      - id: costume_animal_009
        text: "A bat! Ye'd be right at home in me ship's rigging after dark!"
        tags: [bat]
        emotion: amused

    movie_tv:
      - id: costume_movie_001
        text: "I know yer face! From the picture shows! A fine character!"
        tags: [movie, tv, character]
        emotion: impressed

      - id: costume_movie_002
        text: "A fellow pirate from the movies! Welcome to the REAL crew!"
        tags: [pirate, movie]
        emotion: happy

      - id: costume_movie_003
        text: "From a galaxy far, far away, are ye? Well, ye've landed on a pirate's doorstep now!"
        tags: [star_wars, sci_fi, movie]
        emotion: amused

      - id: costume_movie_004
        text: "Now I recognize ye! A famous face on the high seas of entertainment!"
        tags: [movie, tv, celebrity]
        emotion: impressed

      - id: costume_movie_005
        text: "A villain from the stories! We villains must stick together, wouldn't ye say?"
        tags: [villain, movie]
        emotion: amused

    spooky_classic:
      - id: costume_spooky_001
        text: "A mummy! All wrapped up and nowhere to go but trick-or-treating!"
        tags: [mummy]
        emotion: amused

      - id: costume_spooky_002
        text: "Frankenstein's monster! A big strong mate like ye could help hoist me sails!"
        tags: [frankenstein, monster]
        emotion: impressed

      - id: costume_spooky_003
        text: "Count Dracula himself! I'd offer ye a drink, but I suspect ye've already had one!"
        tags: [dracula, vampire]
        emotion: amused

      - id: costume_spooky_004
        text: "A headless horseman! Now how do ye eat yer candy without a head? That's a real puzzle!"
        tags: [headless_horseman]
        emotion: amused

      - id: costume_spooky_005
        text: "The creature from the deep! I've been wantin' to have words with ye about scarin' me fish away!"
        tags: [creature, swamp, sea_monster]
        emotion: amused

    professional:
      - id: costume_pro_001
        text: "A doctor! Perfect, me peg leg's been actin' up lately!"
        tags: [doctor]
        emotion: amused

      - id: costume_pro_002
        text: "An astronaut! Ye sail the stars, I sail the seas! We're kindred spirits!"
        tags: [astronaut, space]
        emotion: impressed

      - id: costume_pro_003
        text: "A firefighter! Could've used ye last time me ship caught fire. Long story."
        tags: [firefighter]
        emotion: amused

      - id: costume_pro_004
        text: "The law! I'll have ye know I'm a perfectly legitimate businessman! Mostly!"
        tags: [police, cop, officer]
        emotion: amused

      - id: costume_pro_005
        text: "A scientist! Perhaps ye can explain how me compass points to treasure instead of north!"
        tags: [scientist, nerd]
        emotion: curious

      - id: costume_pro_006
        text: "A chef! At last! I've been eatin' hardtack and salt beef fer three hundred years!"
        tags: [chef, cook, food]
        emotion: happy

    scifi:
      - id: costume_scifi_001
        text: "A robot! Tell me, do ye rust in saltwater? Askin' fer professional reasons."
        tags: [robot, android]
        emotion: curious

      - id: costume_scifi_002
        text: "An alien! I've sailed to the edge of every map, but I never expected visitors from the stars!"
        tags: [alien, space]
        emotion: surprised

      - id: costume_scifi_003
        text: "From the future, are ye? Tell me, do pirates still rule the seas in yer time?"
        tags: [time_traveler, future, sci_fi]
        emotion: curious

      - id: costume_scifi_004
        text: "A space marine! Locked, loaded, and ready fer candy duty!"
        tags: [space_marine, sci_fi]
        emotion: impressed

      - id: costume_scifi_005
        text: "A tiny green alien! Take me to yer leader! Or yer candy supplier, whichever's closer!"
        tags: [alien, sci_fi]
        emotion: amused

    funny:
      - id: costume_funny_001
        text: "Is that a banana? That's the most terrifying thing I've seen all night. And I've seen sea serpents."
        tags: [banana, food, funny]
        emotion: amused

      - id: costume_funny_002
        text: "A clown! The only thing scarier than a pirate, if ye ask me!"
        tags: [clown]
        emotion: amused

      - id: costume_funny_003
        text: "Now that's a costume I've never seen in all me years! And I've seen plenty, believe me!"
        tags: [unique, creative, funny]
        emotion: impressed

      - id: costume_funny_004
        text: "A hot dog! In all me years at sea, I never thought I'd be threatened by a sausage!"
        tags: [hot_dog, food, funny]
        emotion: amused

      - id: costume_funny_005
        text: "A ceiling fan! Ye really went above and beyond with that one!"
        tags: [pun, funny]
        emotion: amused

      - id: costume_funny_006
        text: "A garden gnome! I'd put ye on me ship, but ye'd blend in with the barnacles!"
        tags: [gnome, funny]
        emotion: amused

      - id: costume_funny_007
        text: "A salt shaker! At last, a kindred spirit from the sea itself!"
        tags: [food, funny]
        emotion: happy

    sports:
      - id: costume_sport_001
        text: "An athlete! I could use someone with yer stamina for scrubbin' the deck!"
        tags: [athlete, sports]
        emotion: amused

